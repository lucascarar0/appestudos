<style>
:root{--bg:#f3f6fb;--sf:#fff;--ink:#14213d;--mu:#5b6785;--ln:#dbe2ef;--ac:#0f9d8a;--ac2:#f2a93b;--ok:#1a8f4d;--no:#d1344a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

:root[data-theme="dark"]{--bg:#0e1628;--sf:#17223b;--ink:#eaf0ff;--mu:#9aa8c7;--ln:#2a3858;--ac:#2cc9b3;--ac2:#f5b95a;--ok:#4cd08a;--no:#ff7088;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;max-width:980px;margin:auto}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;cursor:pointer;border:0;background:none;color:var(--ink);padding:0}
.logo i{font-style:normal;color:var(--ac)}
.pill{background:var(--sf);border:1px solid var(--ln);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:600}
main{max-width:980px;margin:auto;padding:6px 18px 60px}
h1{font-size:clamp(30px,6vw,46px);line-height:1.05;letter-spacing:-1.5px;font-weight:800;margin:14px 0 8px}
h2{font-size:22px;margin:0 0 10px;letter-spacing:-.4px}
p.sub{color:var(--mu);margin:0 0 22px;max-width:56ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:18px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;transition:transform .15s,border-color .15s;display:block;width:100%}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--c,var(--ac))}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c,var(--ac)) 18%,transparent);margin-bottom:12px}
.card b{display:block;font-size:17px}.card small{color:var(--mu)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.back{background:none;border:0;color:var(--mu);font:inherit;font-weight:600;cursor:pointer;padding:6px 0}
input[type=search]{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit;margin-bottom:12px}
.chips,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip,.tab{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:99px;padding:8px 14px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.chip.on,.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:0 0 8px}
.tabs .tab{flex:1;text-align:center;min-width:90px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac)}
.tag.soon{background:color-mix(in srgb,var(--ac2) 22%,transparent);color:var(--ac2)}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:20px;margin-bottom:14px}
.box ul{margin:0;padding-left:20px}.box li{margin:6px 0}
.btn{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:12px 20px;font:700 16px inherit;font-family:inherit;cursor:pointer}
.btn.alt{background:var(--sf);color:var(--ink);border:1px solid var(--ln)}
:root:not([data-theme="dark"]) .btn{color:#fff}
.map{display:flex;flex-direction:column;align-items:center;gap:14px;overflow-x:auto;padding:6px 0}
.root{background:var(--ink);color:var(--bg);border-radius:99px;padding:10px 22px;font-weight:800}
.br{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.node{display:flex;flex-direction:column;align-items:center;gap:8px}
.node>button{border:2px solid var(--ac);background:var(--sf);color:var(--ink);border-radius:14px;padding:8px 14px;font:700 15px inherit;font-family:inherit;cursor:pointer}
.node.open>button{background:var(--ac);color:#fff}
.lv{display:none;flex-direction:column;gap:6px}.node.open .lv{display:flex}
.lv span{background:color-mix(in srgb,var(--ac2) 22%,transparent);border-radius:10px;padding:4px 12px;font-size:14px;animation:pop .2s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.lvls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.lvls .card{text-align:center}
.opt{display:block;width:100%;text-align:left;background:var(--sf);border:2px solid var(--ln);border-radius:14px;padding:13px 16px;margin:9px 0;font:inherit;color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 16%,transparent);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin:6px 0 16px}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.big{font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1}
.lib a{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--ink);padding:14px 0;border-bottom:1px solid var(--ln)}
.lib a:last-child{border:0}.lib a:hover b{color:var(--ac)}.lib small{color:var(--mu)}
.x{overflow-x:auto;max-width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lv p{margin:0;font-size:13px;max-width:240px}details summary{cursor:pointer}details details{margin-top:8px}:root:not([data-theme="dark"]) .btn.alt{color:var(--ink)}</style></head><body>

rp:["A anatomia humana estuda a forma e a organização das estruturas do corpo e fornece o mapa sobre o qual se apoiam a fisiologia, a patologia e toda a prática clínica. Para que médicos, enfermeiros e dentistas descrevam a localização de uma lesão sem ambiguidade, a área adota uma linguagem padronizada, a Terminologia Anatômica, que organiza os nomes de ossos, músculos, vasos, nervos e regiões.",
"Toda descrição parte da posição anatômica: corpo ereto, olhar voltado para frente, braços ao lado do tronco, palmas das mãos para frente e pés paralelos. Essa convenção vale mesmo quando o paciente está deitado ou sentado e, por isso, “direita” e “esquerda” referem-se sempre ao lado do paciente, nunca ao lado de quem o examina.",
"Três planos de secção orientam o estudo. O plano sagital divide o corpo em partes direita e esquerda (o mediano passa pelo centro e separa metades simétricas), o coronal separa a porção anterior da posterior, e o transversal, também chamado axial, separa a porção superior da inferior. Os mesmos planos aparecem nas imagens de tomografia e ressonância, o que liga o conteúdo da disciplina à leitura de exames.",
"Os termos de direção descrevem a posição relativa entre estruturas: superior e inferior, anterior (ventral) e posterior (dorsal), medial e lateral, proximal e distal (nos membros, em relação à raiz) e superficial e profundo. Os movimentos seguem a mesma lógica: flexão e extensão ocorrem no plano sagital, abdução e adução no plano coronal e as rotações no plano transversal.",
"O corpo pode ser estudado por sistemas (esquelético, articular, muscular, circulatório, nervoso, entre outros) ou por regiões (cabeça, pescoço, tronco e membros). A abordagem por sistemas aprofunda cada conjunto funcional; a regional mostra como estruturas de sistemas diferentes convivem no mesmo espaço, o que é essencial para cirurgias, punções e anestesias. Variações anatômicas são frequentes e nem sempre indicam doença."],
exp:["Imagine descrever o local de uma dor sem nenhum vocabulário comum: “um pouco abaixo e para o lado”. Cada pessoa entenderia algo diferente. A anatomia resolveu esse problema criando um sistema de referência fixo, e é por isso que os primeiros dias da disciplina parecem apenas uma lista de palavras: elas são a ferramenta que permitirá todos os capítulos seguintes.",
"O ponto de partida é a posição anatômica, uma postura convencional na qual o corpo está de pé, com a face e as palmas voltadas para frente. O detalhe das palmas é importante: com elas para frente, o rádio e a ulna ficam paralelos e o polegar aponta para fora, de modo que a ulna é medial e o rádio, lateral. Se o antebraço estivesse em pronação, os ossos se cruzariam e a descrição ficaria ambígua.",
"A partir dessa posição imagina-se o corpo cortado por planos. O sagital o divide em direita e esquerda, o coronal em frente e costas e o transversal em parte de cima e de baixo. Quando uma tomografia mostra uma “fatia” do abdome, em geral ela é um corte transversal; já a ressonância do joelho costuma ser apresentada em cortes sagitais e coronais. Saber o plano é saber o que se está vendo.",
"Os termos de direção funcionam em pares e sempre em relação a algo. O joelho é proximal ao tornozelo, mas distal ao quadril. O esterno é medial às mamas, e o nariz é anterior às orelhas. Nos membros, proximal e distal comparam a distância em relação à raiz do membro; no tronco usam-se superior e inferior. Um erro comum é esquecer de dizer “em relação a quê”.",
"Os movimentos descrevem o que as articulações fazem e também se ligam aos planos. Flexionar e estender o cotovelo é um movimento no plano sagital; afastar o braço do tronco (abdução) e aproximá-lo (adução) acontece no plano coronal; girar a cabeça para olhar para o lado é uma rotação no plano transversal. Ao estudar um músculo, vale perguntar qual movimento ele produz e em qual plano.",
"Para estudar, ajuda mais associar do que decorar: desenhar os planos sobre uma figura, repetir as descrições em voz alta usando os pares de termos e revisar com atlas, como os de Netter ou de Sobotta, comparando sempre texto e imagem. Por fim, lembre que variações anatômicas existem; o padrão descrito nos livros é o mais frequente, e não o único possível."],
ref:["NETTER, F. H. <em>Atlas de anatomia humana</em>. Rio de Janeiro: Elsevier.","MOORE, K. L.; DALLEY, A. F.; AGUR, A. M. R. <em>Anatomia orientada para a clínica</em>. Rio de Janeiro: Guanabara Koogan.","STANDRING, S. (ed.). <em>Gray’s anatomia: a base anatômica da prática clínica</em>. Rio de Janeiro: Elsevier.","PUTZ, R.; PABST, R. (ed.). <em>Sobotta: atlas de anatomia humana</em>. Rio de Janeiro: Guanabara Koogan.","SOCIEDADE BRASILEIRA DE ANATOMIA. <em>Terminologia anatômica internacional</em>. São Paulo: Manole, 2001."]});
Object.assign(D["Cálculo I"],{
rp:["O Cálculo Diferencial e Integral é a matemática da variação. Enquanto a álgebra descreve situações estáticas, o cálculo permite responder a perguntas como: com que rapidez uma grandeza muda neste instante? E quanto dela se acumulou ao longo de um intervalo? Essas duas perguntas dão origem, respectivamente, à derivada e à integral, e ambas se apoiam na noção de limite.",
"O limite de uma função f(x) quando x tende a a é o valor do qual f(x) se aproxima à medida que x se aproxima de a, sem que x precise ser igual a a. Uma função é contínua em a quando o limite existe, a função está definida em a e os dois valores coincidem. Formas indeterminadas como 0/0 exigem manipulação algébrica ou limites notáveis, como lim sen x / x = 1 quando x tende a 0.",
"A derivada de f em x é definida como o limite de (f(x+h) − f(x))/h quando h tende a zero. Geometricamente, é a inclinação da reta tangente ao gráfico; fisicamente, é uma taxa de variação instantânea, como a velocidade. As regras de derivação (constante, potência, soma, produto, quociente e cadeia) permitem calcular derivadas sem recorrer à definição a cada vez.",
"A derivada também é uma ferramenta de análise. Pontos em que f′ se anula ou não existe são candidatos a máximos e mínimos; o sinal de f′ indica onde a função cresce ou decresce, e o de f″ indica a concavidade. Esses recursos resolvem problemas de otimização, como minimizar o custo de uma embalagem, e de taxas relacionadas, em que várias grandezas variam ao mesmo tempo.",
"A integral definida de f entre a e b mede a área líquida entre o gráfico e o eixo x e, de forma mais geral, o acúmulo de uma grandeza. O Teorema Fundamental do Cálculo liga as duas metades da disciplina: se F′ = f, a integral de f de a até b vale F(b) − F(a). Técnicas como substituição, integração por partes e frações parciais ajudam a encontrar primitivas."],
exp:["Pense no velocímetro de um carro: ele não mostra a velocidade média da viagem, mas a velocidade naquele instante. Calcular algo “num instante” parece impossível, já que em um instante não passa tempo algum. O cálculo contorna esse impasse observando o que acontece em intervalos cada vez menores, e a ideia que formaliza isso é o limite.",
"Considere f(x) = (x² − 1)/(x − 1). Em x = 1 a expressão não está definida, pois resulta em 0/0. Mas, fatorando, f(x) = x + 1 para x diferente de 1, e os valores se aproximam de 2 quando x se aproxima de 1. Dizemos que o limite é 2. Note o que o limite mede: o comportamento perto do ponto, e não o valor no ponto.",
"A derivada usa exatamente esse raciocínio. Toma-se a variação média entre x e x + h e faz-se h tender a zero. Para f(x) = x², a variação média é (2xh + h²)/h = 2x + h, que tende a 2x. Assim, a inclinação da tangente em x = 3 é 6 e, se x² representa a posição de um móvel, 6 é sua velocidade nesse instante.",
"Na prática, ninguém calcula derivadas pela definição o tempo todo; as regras de derivação existem para isso. A regra do produto diz que (fg)′ = f′g + fg′, e não f′g′, um erro muito comum. A regra da cadeia trata funções compostas: a derivada de sen(x²) é cos(x²) multiplicado por 2x, ou seja, deriva-se “por fora” e multiplica-se pela derivada “de dentro”.",
"Em aplicações, a derivada ajuda a decidir. Se o custo de produção é C(x), o custo marginal C′(x) estima quanto custa produzir mais uma unidade. Se f′ muda de positiva para negativa em um ponto, ali há um máximo local. Para otimizar, escreve-se a grandeza como função de uma variável, deriva-se, iguala-se a zero e verifica-se se o ponto é de máximo ou de mínimo.",
"A integral faz o caminho inverso: dada a taxa de variação, recupera o acúmulo. O Teorema Fundamental do Cálculo garante que, conhecida uma primitiva F, a área sob f entre a e b é F(b) − F(a). Ao estudar, três cuidados evitam muitos erros: não esquecer a constante + C nas integrais indefinidas, conferir se um limite 0/0 realmente exige manipulação e treinar bastante, pois o cálculo se aprende resolvendo exercícios."],
ref:["STEWART, J. <em>Cálculo</em>. v. 1. São Paulo: Cengage Learning.","GUIDORIZZI, H. L. <em>Um curso de cálculo</em>. v. 1. Rio de Janeiro: LTC.","THOMAS, G. B.; WEIR, M. D.; HASS, J. <em>Cálculo</em>. v. 1. São Paulo: Pearson.","ÁVILA, G. <em>Cálculo das funções de uma variável</em>. v. 1. Rio de Janeiro: LTC.","LEITHOLD, L. <em>O cálculo com geometria analítica</em>. v. 1. São Paulo: Harbra."]});
Object.assign(D["Direito Constitucional"],{
rp:["O Direito Constitucional estuda a Constituição, norma que ocupa o topo do ordenamento jurídico e fundamenta a validade de todas as outras. A Constituição da República Federativa do Brasil de 1988 organiza o Estado, distribui competências entre a União, os Estados, o Distrito Federal e os Municípios, estrutura os Poderes e assegura direitos fundamentais. Nenhuma lei ou ato do poder público pode contrariá-la: é o princípio da supremacia da Constituição.",
"A doutrina distingue o poder constituinte originário, que cria uma nova ordem jurídica e é inicial, autônomo e ilimitado juridicamente, do poder constituinte derivado, que existe por ordem da própria Constituição e se submete aos limites que ela impõe. O derivado se manifesta, entre outras formas, na reforma por emendas constitucionais, que exige procedimento mais rígido do que o das leis comuns.",
"O texto de 1988 é dividido em preâmbulo, parte permanente e Ato das Disposições Constitucionais Transitórias. Os princípios fundamentais (arts. 1º a 4º) afirmam, por exemplo, a dignidade da pessoa humana e a separação entre os Poderes; os direitos e garantias fundamentais (arts. 5º a 17) reúnem direitos individuais, coletivos, sociais, de nacionalidade e políticos.",
"O art. 60, § 4º, protege certas matérias contra emendas que tendam a aboli-las, as chamadas cláusulas pétreas: a forma federativa de Estado, o voto direto, secreto, universal e periódico, a separação dos Poderes e os direitos e garantias individuais. Elas funcionam como núcleo de identidade da Constituição e limitam o poder de reforma.",
"Para garantir a supremacia constitucional existe o controle de constitucionalidade. No modelo difuso, qualquer juiz ou tribunal pode afastar uma norma inconstitucional ao decidir um caso concreto; no concentrado, o Supremo Tribunal Federal julga ações como a ADI, a ADC e a ADPF, com efeitos para todos. Completam a proteção os remédios constitucionais: habeas corpus, habeas data, mandado de segurança, mandado de injunção e ação popular."],
exp:["Pense na ordem jurídica como um edifício de vários andares: no topo está a Constituição; abaixo dela, as leis, depois decretos, portarias e contratos. Cada andar só se sustenta se estiver de acordo com o de cima. Esse raciocínio, chamado de hierarquia das normas, explica por que uma lei municipal pode ser invalidada se contrariar a Constituição Federal.",
"O ponto de partida é entender de onde vem a Constituição. O poder constituinte originário rompe com a ordem anterior e funda uma nova; o derivado atua dentro das regras fixadas pelo texto. Por isso uma emenda constitucional, embora altere a Constituição, tem limites: não pode, por exemplo, abolir as cláusulas pétreas do art. 60, § 4º.",
"Outra distinção essencial é entre regras e princípios. Regras funcionam em termos de “tudo ou nada”: se os fatos previstos ocorrem, a consequência se aplica. Princípios, como a dignidade da pessoa humana ou a igualdade, indicam valores a serem realizados na maior medida possível e podem entrar em conflito; nesses casos, o intérprete pondera os princípios à luz do caso concreto. Essa discussão é desenvolvida por autores como Barroso e Mendes e Branco.",
"Os direitos fundamentais ocupam posição central. O art. 5º garante, por exemplo, a igualdade, a liberdade de expressão, a inviolabilidade do domicílio e o devido processo legal, e prevê instrumentos para protegê-los: o habeas corpus contra ameaças à liberdade de locomoção, o mandado de segurança para direito líquido e certo e o habeas data para acesso e correção de informações pessoais.",
"Quando uma norma contraria a Constituição, entra o controle de constitucionalidade. No controle difuso, a questão surge dentro de um processo comum, e a decisão vale, em regra, para as partes. No concentrado, o STF analisa a norma em abstrato, por meio de ações como a ADI, e a decisão tem eficácia contra todos. Um exemplo: uma lei estadual que invade competência da União pode ser levada ao STF por um legitimado.",
"Na hora de estudar, vale ler o texto constitucional junto com um manual, ligando cada instituto ao artigo correspondente, e acompanhar decisões do STF, que mostram como as normas são aplicadas. Atenção a dois erros frequentes: confundir a competência de cada ente federativo (arts. 21 a 24) e tratar todos os direitos como absolutos, quando muitos admitem restrições proporcionais."],
ref:["BRASIL. <em>Constituição da República Federativa do Brasil de 1988</em>. Brasília: Senado Federal.","MENDES, G. F.; BRANCO, P. G. G. <em>Curso de direito constitucional</em>. São Paulo: Saraiva.","BARROSO, L. R. <em>Curso de direito constitucional contemporâneo</em>. São Paulo: Saraiva.","SILVA, J. A. da. <em>Curso de direito constitucional positivo</em>. São Paulo: Malheiros.","LENZA, P. <em>Direito constitucional esquematizado</em>. São Paulo: Saraiva.","MORAES, A. de. <em>Direito constitucional</em>. São Paulo: Atlas."]});
